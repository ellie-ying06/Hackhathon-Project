
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell an Item | NeighbourHub</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header class="navbar">
        <a class="logo" href="/">CommunityConnect</a>

        <nav>
            <a href="/">Home</a>
            <a href="/static/pages/community.html">Community</a>
            <a href="/static/pages/events.html">Events</a>
            <a href="/static/pages/register.html">Register</a>
            <a href="/static/pages/market.html">Marketplace</a>
            <a href="/static/pages/help.html">Neighbour Help</a>
            <a href="/static/pages/profilepage.html"
            class="nav-profile" title="My Profile" aria-label="My Profile">
            <img src="/static/images/user.png" alt="Profile" class="nav-avatar"> </a>
        </nav>
    </header>

    <main class="container add-product-page">
        <a href="/static/pages/market.html" class="back-link">
            &larr; Back to Marketplace
        </a>

        <section class="add-product-card">
            <h1>Sell an Item</h1>

            <p class="add-product-subtitle">
                Give your unused items a second life in your community.
            </p>

            <form id="addProductForm">
                <div class="form-group">
                    <label for="name">Product Name *</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. Study desk"
                        required
                        maxlength="100"
                    >
                </div>

                <div class="form-group">
                    <label for="price">Price (RM) *</label>
                    <input
                        type="number"
                        id="price"
                        name="price"
                        min="0"
                        step="0.01"
                        placeholder="e.g. 50.00"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Books">Books</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="condition">Condition *</label>
                    <select id="condition" name="condition" required>
                        <option value="">Select condition</option>
                        <option value="New">New</option>
                        <option value="Like New">Like New</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                    </select>
                </div>

                
                <div class="form-group">
                    <label for="location">Location *</label>

                    <select id="location" name="location" required>
                        <option value="">Select your residence</option>
                        <option value="Sunway Residence">SunU Residence</option>
                        <option value="Waterfront Residence">Waterfront Residence</option>
                        <option value="Lagoon View">Lagoon View</option>
                        <option value="Other Sunway/Subang Residence">
                            Other (Sunway/Subang Area)
                        </option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        maxlength="2000"
                        placeholder="Describe your item..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="image">Product Image</label>

                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <small>JPG, PNG, or WebP. Maximum size: 5 MB.</small>

                    <div id="imagePreviewContainer" hidden>
                        <img
                            id="imagePreview"
                            alt="Selected product image preview"
                        >
                    </div>
                </div>


                <input
                    type="number"
                    id="member_id"
                    name="member_id"
                    readonly
                    required
                >

                <small>
                    Automatically filled using your registration details.
                </small>
                </div>


                <button type="submit" id="submitProductBtn" class="sell-item-btn">
                    Publish Product
                </button>

                <p id="formMessage" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>CommunityConnect © 2026 | FiveNova</p>
    </footer>

    <script src="/static/js/add-product.js"></script>
</body>
</html>
