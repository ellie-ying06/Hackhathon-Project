
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product | NeighbourHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="add-product-page">
        <a href="/market" class="back-link">
            &larr; Back to Marketplace
        </a>

        <section class="add-product-card">
            <h1>Edit Product</h1>
            <p class="add-product-subtitle">
                Update your listing details below.
            </p>

            <p id="editLoading">Loading product details...</p>

            <form id="editProductForm" hidden>
                <div class="form-group">
                    <label for="name">Product Name</label>
                    <input id="name" name="name" type="text"
                           maxlength="100" required>
                </div>

                <div class="form-group">
                    <label for="price">Price (RM)</label>
                    <input id="price" name="price" type="number"
                           min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="Furniture">Furniture</option>
                        <option value="Books">Books</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="condition">Condition</label>
                    <select id="condition" name="condition" required>
                        <option value="New">New</option>
                        <option value="Like New">Like New</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input id="location" name="location" type="text"
                           maxlength="150" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"
                              rows="5" maxlength="2000"></textarea>
                </div>

                <div class="form-group">
                    <label for="image">Change Product Image (optional)</label>
                    <input id="image" name="image" type="file"
                           accept="image/jpeg,image/png,image/webp">

                    <small>Leave empty to keep the current image.
                    JPG, PNG, or WebP, up to 5 MB.</small>

                    <img id="currentImage" alt="Current product image"
                         hidden style="max-width:300px; width:100%;">

                    <div id="imagePreviewContainer" hidden>
                        <p>New image preview:</p>
                        <img id="imagePreview" alt="New image preview"
                             style="max-width:300px; width:100%;">
                    </div>
                </div>

                <button type="submit" id="saveProductBtn"
                        class="sell-item-btn">
                    Save Changes
                </button>
                <p id="editMessage" role="status"
                   aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="/static/js/product-detail.js"></script>
</body>
</html>
