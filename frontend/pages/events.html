<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommunityConnect | Events</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Nav Bar -->
    <header class="navbar">
      <a class="logo" href="index.html">CommunityConnect</a>

      <nav>
        <a href="/">Home</a>
        <a href="/static/pages/community.html">Community</a>
        <a href="/static/pages/events.html">Events</a>
        <a href="/static/pages/register.html">Register</a>
        <a href="/static/pages/market.html">Marketplace</a>
        <a href="/static/pages/help.html">Neighbour Help</a>
        <a href="/static/pages/profilepage.html"
        class="nav-profile" title="My Profile" aria-label="My Profile">
        <img src="/static/images/user.png" alt="Profile" class="nav-avatar"> </a>
      </nav>
    </header>

    <!-- About Events -->
    <main class="container">
        <div class="feed-header">
            <div>
                <h1>Community Events</h1>
                <p style="color: #66786e; margin: 5px 0 0 0;">Discover and create community events here. Sign up or make your own event now!</p>
            </div>
            <a href="/static/pages/eventPost_Creation.html" class="btn">+ Create Event</a>
        </div>
        <!-- Event Navigation/Filtering -->
        <div class="event-categories">
            <button
                class="category-btn active"
                event-category="All_Events">
                All Events
            </button>
            <button
                class="category-btn"
                event-category="Upcoming_Events">
                Upcoming Events
            </button>
            <button
                class="category-btn"
                event-category="Past_Events">
                Past Events
            </button>
        </div>
        <!-- Event Posts -->
        <section class="posts-section">
            <div id="threadList" class="thread-list">
                <!-- Threads dynamically inserted here -->
            </div>
        </section>
    </main>

    <footer>
      <p>CommunityConnect © 2026 | FiveNova</p>
    </footer>

    <script src="/static/js/script.js"></script>

</body>
</html>
