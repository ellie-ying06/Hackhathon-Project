<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommunityConnect | Events</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Nav Bar -->
    <header class="navbar">
      <a class="logo" href="index.html">CommunityConnect</a>

      <nav>
        <a href="/">Home</a>
        <a href="/static/pages/events.html">Events</a>
        <a href="/static/pages/register.html">Register</a>
        <a href="/static/pages/market.html">Marketplace</a>
        <a href="/static/pages/help.html">Neighbour Help</a>
      </nav>

    <!-- About Events -->
    <h1>Community Events</h1>
    <p>Here on CommunityConnect, you can easily sign up and RSVP for events in your community! Just click on an event post and enter your details!</p>

    <!-- Event Navigation/Filtering -->
    <div class="event-categories">
      <button
          class="category-btn active"
          data-category="">
          All Events
      </button>
      <button
          class="category-btn active"
          data-category="">
          Upcoming Events
      </button>
      <button
          class="category-btn active"
          data-category="">
          Past Events
      </button>

    <!-- Event Posts -->
    <section class="posts-section">
        <div id="threadList" class="thread-list">
            <!-- Threads dynamically inserted here -->
        </div>
    </section>

    <footer>
      <p>CommunityConnect © 2026 | FiveNova</p>
    </footer>

    <script src="/static/js/script.js"></script>
