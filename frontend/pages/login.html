
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CommunityConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7f6;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #174d40;
        }

        p {
            color: #666;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #174d40;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #103a30;
        }

        #loginMessage {
            margin-top: 16px;
            overflow-wrap: anywhere;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <main class="login-container">
        <h1>Welcome Back!</h1>
        <p>Log in to your CommunityConnect account.</p>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
            >

            <button type="submit">Log In</button>
        </form>

        <p id="loginMessage" role="status"></p>

        <div class="register-link">
            Don't have an account?
            <a href="/static/pages/register.html">Register here</a>
        </div>
    </main>

    <script src="/static/js/login.js"></script>
</body>
</html>
