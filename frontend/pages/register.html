<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommunityConnect | Register</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <!-- =========================
         NAVIGATION BAR
    ========================== -->
    <header class="navbar">

        <a class="logo" href="/">
            CommunityConnect
        </a>

          <nav>
            <a href="/">Home</a>
            <a href="/static/pages/community.html">Events</a>
            <a href="/static/pages/register.html" class="active">Register</a>
            <a href="/static/pages/market.html">Marketplace</a>
            <a href="/static/pages/help.html">
                Neighbour Help
            </a>
        </nav>

    </header>
    <!-- =========================
     RESIDENT REGISTRATION
    ========================== -->     

    <main class="register-page">

        <div class="register-container">

            <div class="register-heading">
                <h1>Join Our Community</h1>
                <p>
                    Register as a resident now to connect,
                    share, and grow with your neighbours.
                </p>
            </div>

        <form id="registerForm">

            <!-- FULL NAME -->
            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >

            <!-- EMAIL -->
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required
            >

            <!-- PHONE -->
            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="e.g. 0123456789"
            >

            <!-- RESIDENTIAL AREA -->
            <label for="address">Residential Area</label>

            <select id="address" name="address" required>
                <option value="">Select your residence</option>
                <option value="Sunway Residence">SunU Residence</option>
                <option value="Waterfront Residence">Waterfront Residence</option>
                <option value="Lagoon View">Lagoon View</option>
                <option value="Other Sunway/Subang Residence">Other (Sunway/Subang Area)</option>
            </select>
        

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="register-btn">
                Register Now
            </button>

            <p id="registerMessage" role="status" aria-live="polite"></p>

        </form>

    </div>

    </main>

<footer>
    <p>CommunityConnect © 2026 | FiveNova</p>
</footer>

    



<script src="/static/js/register.js"></script>
</body>
</html>
